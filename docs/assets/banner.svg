<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="flycast-romm banner">
  <defs>
    <!-- Dark background gradient, deep navy to near-black -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>

    <!-- Orange swirl glow -->
    <radialGradient id="swirl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F45B00;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#F45B00;stop-opacity:0"/>
    </radialGradient>

    <!-- Thin orange-to-amber gradient for swirl arcs -->
    <linearGradient id="arc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A20"/>
      <stop offset="100%" style="stop-color:#F45B00"/>
    </linearGradient>

    <clipPath id="bounds">
      <rect width="860" height="200" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid lines (horizontal) for depth -->
  <g clip-path="url(#bounds)" opacity="0.06" stroke="#F45B00" stroke-width="1">
    <line x1="0" y1="40" x2="860" y2="40"/>
    <line x1="0" y1="80" x2="860" y2="80"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="160" x2="860" y2="160"/>
    <line x1="172" y1="0" x2="172" y2="200"/>
    <line x1="344" y1="0" x2="344" y2="200"/>
    <line x1="516" y1="0" x2="516" y2="200"/>
    <line x1="688" y1="0" x2="688" y2="200"/>
  </g>

  <!-- Swirl glow halo (soft orange bloom behind the spiral) -->
  <ellipse cx="100" cy="100" rx="90" ry="90" fill="url(#swirl-glow)" clip-path="url(#bounds)"/>

  <!--
    Original Dreamcast-inspired spiral: four arcs that open outward,
    rotated 0°, 90°, 180°, 270° around the centre (100, 100).
    Each arc is a thick stroke tracing a 270° sweep from a tight inner
    radius to a larger outer radius, giving the swirl-of-four look.
    Drawn as SVG paths with stroke-linecap="round".
  -->
  <g transform="translate(100,100)" clip-path="url(#bounds)">

    <!-- Arm 1 — top-right -->
    <path d="
      M 8,0
      A 8,8 0 0,1 0,-8
      A 20,20 0 0,1 14,-14
      A 36,36 0 0,1 36,0
      A 52,52 0 0,1 14,49
    "
      fill="none"
      stroke="url(#arc-grad)"
      stroke-width="9"
      stroke-linecap="round"
      opacity="0.95"
    />

    <!-- Arm 2 — bottom-right (rotate 90°) -->
    <path d="
      M 8,0
      A 8,8 0 0,1 0,-8
      A 20,20 0 0,1 14,-14
      A 36,36 0 0,1 36,0
      A 52,52 0 0,1 14,49
    "
      fill="none"
      stroke="url(#arc-grad)"
      stroke-width="9"
      stroke-linecap="round"
      opacity="0.95"
      transform="rotate(90)"
    />

    <!-- Arm 3 — bottom-left (rotate 180°) -->
    <path d="
      M 8,0
      A 8,8 0 0,1 0,-8
      A 20,20 0 0,1 14,-14
      A 36,36 0 0,1 36,0
      A 52,52 0 0,1 14,49
    "
      fill="none"
      stroke="url(#arc-grad)"
      stroke-width="9"
      stroke-linecap="round"
      opacity="0.95"
      transform="rotate(180)"
    />

    <!-- Arm 4 — top-left (rotate 270°) -->
    <path d="
      M 8,0
      A 8,8 0 0,1 0,-8
      A 20,20 0 0,1 14,-14
      A 36,36 0 0,1 36,0
      A 52,52 0 0,1 14,49
    "
      fill="none"
      stroke="url(#arc-grad)"
      stroke-width="9"
      stroke-linecap="round"
      opacity="0.95"
      transform="rotate(270)"
    />

    <!-- Centre dot -->
    <circle cx="0" cy="0" r="5" fill="#F45B00"/>
  </g>

  <!-- Vertical separator line -->
  <line x1="186" y1="30" x2="186" y2="170" stroke="#F45B00" stroke-width="1.5" opacity="0.4"/>

  <!-- Project name -->
  <text
    x="210" y="106"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-1"
    fill="#ffffff"
  >flycast<tspan fill="#F45B00">-romm</tspan></text>

  <!-- Subtitle -->
  <text
    x="212" y="138"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    font-weight="400"
    letter-spacing="0.5"
    fill="#8b949e"
  >Stream Sega Dreamcast · NAOMI · Atomiswave to RomM</text>

  <!-- Platform tags (small pill-style rectangles) -->
  <g transform="translate(212, 152)">
    <!-- dc -->
    <rect x="0" y="0" width="32" height="18" rx="4" fill="#F45B00" opacity="0.18"/>
    <text x="16" y="13" text-anchor="middle"
      font-family="'Segoe UI', monospace, sans-serif"
      font-size="10" font-weight="600"
      fill="#F45B00">dc</text>

    <!-- naomi -->
    <rect x="40" y="0" width="46" height="18" rx="4" fill="#F45B00" opacity="0.18"/>
    <text x="63" y="13" text-anchor="middle"
      font-family="'Segoe UI', monospace, sans-serif"
      font-size="10" font-weight="600"
      fill="#F45B00">naomi</text>

    <!-- naomi2 -->
    <rect x="94" y="0" width="54" height="18" rx="4" fill="#F45B00" opacity="0.18"/>
    <text x="121" y="13" text-anchor="middle"
      font-family="'Segoe UI', monospace, sans-serif"
      font-size="10" font-weight="600"
      fill="#F45B00">naomi2</text>

    <!-- atomiswave -->
    <rect x="156" y="0" width="76" height="18" rx="4" fill="#F45B00" opacity="0.18"/>
    <text x="194" y="13" text-anchor="middle"
      font-family="'Segoe UI', monospace, sans-serif"
      font-size="10" font-weight="600"
      fill="#F45B00">atomiswave</text>
  </g>
</svg>
